<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Exemplo de integração · Agenda Tech Resolute</title>
    <style>
      body {
        margin: 0;
        font: 15px/1.5 Inter, "Segoe UI", Helvetica, Arial, sans-serif;
        color: #16131f;
        background: #ffffff;
      }
      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 32px 16px 64px;
      }
      h1 {
        font-size: 26px;
        margin: 0 0 8px;
      }
      h2 {
        font-size: 18px;
        margin: 40px 0 8px;
      }
      p {
        color: #3d3850;
        margin: 0 0 16px;
      }
      code {
        background: #f1eef6;
        padding: 2px 6px;
        border-radius: 6px;
        font-size: 13px;
      }
      a {
        color: #6d28d9;
      }
      #status {
        margin-top: 16px;
        font-weight: 600;
        color: #1e6b34;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Site de exemplo</h1>
      <p>
        Esta página simula o site da agência usando o <code>embed.js</code>. Os agendamentos são feitos de verdade no
        perfil de demonstração.
      </p>

      <h2>1. Botão com janela</h2>
      <p>O script cria o botão logo depois dele.</p>
      <script src="/embed.js" data-url="/marina-demo/conversa-inicial" data-label="Agendar conversa" async></script>

      <h2>2. Qualquer link abre a janela</h2>
      <p><a href="/marina-demo/ligacao-rapida" data-techresolute-open>Prefere uma ligação rápida? Clique aqui.</a></p>

      <h2>3. Na própria página</h2>
      <div data-techresolute-inline="/marina-demo/consultoria-tecnica" data-title="Agendar consultoria técnica"></div>

      <p id="status" role="status"></p>
    </main>
    <script>
      window.addEventListener("techresolute:booking-confirmed", function (event) {
        document.getElementById("status").textContent =
          "O site recebeu a confirmação: reunião em " + new Date(event.detail.startAt).toLocaleString("pt-BR") + ".";
      });
    </script>
  </body>
</html>
